name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - run: go test ./...

      - name: Lint shell scripts
        run: shellcheck scripts/dependabot-merge-train.sh scripts/lib/merge-train-lib.sh
